name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-projects:
    name: Detect Projects
    runs-on: ubuntu-latest

    outputs:
      flutter_exists: ${{ steps.detect.outputs.flutter_exists }}
      api_exists: ${{ steps.detect.outputs.api_exists }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect applications
        id: detect
        shell: bash
        run: |
          if [ -f "apps/client/pubspec.yaml" ]; then
            echo "flutter_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter_exists=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f "apps/api/package.json" ]; then
            echo "api_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository structure check
        shell: bash
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f .gitignore
          test -f .editorconfig
          test -d apps
          test -d docs
          test -d infra
          test -d scripts
          test -d .github

          echo "Repository structure is valid."

  flutter-checks:
    name: Flutter Checks
    needs: detect-projects

    if: needs.detect-projects.outputs.flutter_exists == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        shell: bash
        run: |
          if [ -d "test" ] && find test -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found. Skipping."
          fi

  api-checks:
    name: NestJS Checks
    needs: detect-projects

    if: needs.detect-projects.outputs.api_exists == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Node.js version
        run: node --version

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint --if-present

      - name: Run tests
        run: npm run test --if-present -- --runInBand

      - name: Build API
        run: npm run build --if-present
